<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Interface</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="header">
        <h2>AI Assistant</h2>
        <button style="padding:10px 20px;background:var(--border);color:var(--text);border:none;border-radius:10px;cursor:pointer" onclick="clearChat()">Clear</button>
        <button style="padding:10px 20px;background:var(--border);color:var(--text);border:none;border-radius:10px;cursor:pointer" onclick="toggleDark()">🌙</button>
    </div>
    
    <div class="chat-area" id="chat">
        <div class="msg bot">Hello! I am a simulated AI. Ask me anything!</div>
    </div>
    
    <div class="typing" id="typing">
        <span></span><span></span><span></span>
    </div>
    
    <div class="input-area">
        <input type="text" id="msgInput" placeholder="Type a message..." onkeypress="if(event.key==='Enter')send()">
        <button onclick="send()">➤</button>
    </div>

    <script src="script.js"></script>
</body>

</html>
