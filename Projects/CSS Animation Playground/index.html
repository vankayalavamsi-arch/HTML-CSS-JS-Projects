<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animation Playground</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="controls">
        <h2>Controls</h2>
        <div>
            <label>Animation</label>
            <select id="anim" onchange="update()">
                <option value="bounce">Bounce</option>
                <option value="spin">Spin</option>
                <option value="pulse">Pulse</option>
                <option value="shake">Shake</option>
                <option value="fade">Fade</option>
            </select>
        </div>
        <div>
            <label>Duration: <span id="durVal">1s</span></label>
            <input type="range" id="dur" min="0.1" max="5" step="0.1" value="1" oninput="update()">
        </div>
        <div>
            <label>Delay: <span id="delVal">0s</span></label>
            <input type="range" id="del" min="0" max="3" step="0.1" value="0" oninput="update()">
        </div>
        <div>
            <label>Iteration</label>
            <select id="iter" onchange="update()">
                <option value="infinite">Infinite</option>
                <option value="1">1</option>
                <option value="3">3</option>
            </select>
        </div>
        <div class="code-box" id="codeBox">
            animation: bounce 1s ease 0s infinite;
            <button class="copy-btn" onclick="copyCss()">Copy</button>
        </div>
        <button class="theme-toggle" onclick="toggleDark()">🌙</button>
    </div>
    
    <div class="preview">
        <div class="box" id="box"></div>
    </div>

    <script src="script.js"></script>
</body>

</html>
