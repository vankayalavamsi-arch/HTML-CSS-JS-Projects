<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Art Editor</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="toolbar">
        <h2>Pixel Art</h2>
        <div>
            <label>Grid Size</label>
            <input type="number" id="size" value="16" min="4" max="64">
        </div>
        <div>
            <label>Color</label>
            <input type="color" id="color" value="#000000">
        </div>
        <button onclick="setTool('draw')">Pencil</button>
        <button onclick="setTool('erase')">Eraser</button>
        <button onclick="setTool('fill')">Fill Bucket</button>
        <button class="grid-btn" onclick="toggleGrid()">Toggle Grid</button>
        <button onclick="clearCanvas()">Clear</button>
        <button onclick="createGrid()">Apply Size</button>
        <button style="background:#00b894" onclick="downloadCanvas()">Download PNG</button>
        <button class="grid-btn" onclick="toggleDark()">🌙</button>
    </div>
    <div class="canvas-area">
        <canvas id="canvas" width="640" height="640"></canvas>
    </div>

    <script src="script.js"></script>
</body>

</html>
