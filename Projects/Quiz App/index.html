<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body> 

    <div class="container">
        <h1>Quiz App</h1>
        <button id="StartBtn" class="Btnclass">Start Quiz</button>
        <div id="Question_container" class="hidden">
            <p id="Question_text"></p>
            <ul id="Choices_list">
            </ul>
        </div>
        <button id="NextBtn" class="Btnclass hidden">Next Question</button>

        <div id="Result_container" class="hidden">
            <p>Your Score:</p>
            <p id="Score"></p>
            <button id="RestartBtn" class="Btnclass">Restart Quiz</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
