<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="header">
        <div>Score: <span id="score">0</span></div>
        <div>High: <span id="high">0</span></div>
    </div>
    
    <div class="game-container">
        <canvas id="game" width="400" height="400"></canvas>
        <div class="overlay" id="overlay">
            <h2 id="msg">Game Over</h2>
            <button class="btn-play" onclick="startGame()">Play Again</button>
        </div>
    </div>
    
    <div class="controls">
        <button id="up" onclick="setDir(0,-1)">↑</button>
        <button id="left" onclick="setDir(-1,0)">←</button>
        <button id="down" onclick="setDir(0,1)">↓</button>
        <button id="right" onclick="setDir(1,0)">→</button>
    </div>
    
    <button class="btn-dark" onclick="toggleDark()">🌙</button>

    <script src="script.js"></script>
</body>

</html>
