<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Race</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="stats">
        <div>WPM: <span id="wpm">0</span></div>
        <div>ACC: <span id="acc">100</span>%</div>
        <div>TIME: <span id="time">60</span>s</div>
    </div>
    
    <div class="text-box" id="textBox"></div>
    
    <input type="text" id="typeInput" placeholder="Start typing here..." disabled autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    
    <div class="actions">
        <button onclick="resetGame()">Restart</button>
        <button onclick="toggleDark()">🌙</button>
    </div>

    <script src="script.js"></script>
</body>

</html>
