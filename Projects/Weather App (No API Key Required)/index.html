<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Weather</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="controls">
        <button onclick="changeWeather()">🔄 Change Weather</button>
        <button onclick="toggleDark()">🌙</button>
    </div>
    
    <div class="container">
        <h1 id="city">San Francisco</h1>
        <div class="temp" id="temp">18°C</div>
        <div class="desc" id="desc">Clear Sky</div>
        
        <div class="details">
            <div class="detail-item">
                <h4>Humidity</h4>
                <p id="hum">65%</p>
            </div>
            <div class="detail-item">
                <h4>Wind</h4>
                <p id="wind">12 km/h</p>
            </div>
        </div>
        
        <div class="forecast" id="forecast"></div>
    </div>

    <script src="script.js"></script>
</body>

</html>
