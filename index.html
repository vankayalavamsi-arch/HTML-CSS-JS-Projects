<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Showcase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <div class="header-inner">
            <div class="logo">
                <span class="logo-icon">🚀</span>
                <h1>My Projects</h1>
            </div>
            <div class="header-right">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Search projects..." aria-label="Search projects">
                </div>
                <button class="theme-btn" id="themeToggle" aria-label="Toggle theme">🌙</button>
            </div>
        </div>
        <div class="stats-row">
            <span>Total: <strong id="totalProjects">0</strong></span>
            <span>Showing: <strong id="showingProjects">0</strong></span>
        </div>
    </header>

    <main class="main">
        <div class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="tool">Tools</button>
            <button class="filter-btn" data-filter="app">Apps</button>
            <button class="filter-btn" data-filter="game">Games</button>
        </div>

        <div id="projectsGrid" class="grid"></div>

        <div id="noResults" class="no-results" style="display:none;">
            <p>No projects found</p>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Project Showcase</p>
    </footer>

    <button class="top-btn" id="scrollToTop" style="display:none;" aria-label="Scroll to top">↑</button>

    <div id="loadingSpinner" class="loading-overlay" style="display:none;">
        <div class="spinner"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
